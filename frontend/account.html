  <script>try{var l=localStorage.getItem("cropguard.lang");if(l&&l!=="en"){document.documentElement.classList.add("i18n-pending");setTimeout(function(){document.documentElement.classList.remove("i18n-pending")},2500)}}catch(e){}</script>
  <style>.i18n-pending body{visibility:hidden}</style>
  <script>
  /* Start-up watchdog. A slow connection is NOT an error, so: it waits 20 s, it removes itself the moment the page
     does start, and it speaks up at once only if a script really failed to load or crashed. */
  (function () {
    var onFile = location.protocol === "file:", box = null, crashed = false;
    var ready = function () { return document.documentElement.getAttribute("data-ready"); };
    function show() {
      if (ready() || box) return;
      box = document.createElement("div"); box.className = "boot-warning"; box.setAttribute("role", "alert");
      box.innerHTML = onFile
        ? "<strong>Open CropGuard through a small web server, not by double-clicking the file.</strong><p>Browsers block the page scripts on file:// addresses. Double-click <code>run-frontend.bat</code> (Windows) or run <code>./run-frontend.sh</code> in the project folder, or in the <code>frontend</code> folder run <code>python -m http.server 5500</code> and open <code>http://127.0.0.1:5500</code>.</p>"
        : crashed
          ? "<strong>This page hit a problem while starting.</strong><p>Press Ctrl+Shift+R to reload. If it still looks wrong, open the browser console (F12) and look for a red error message.</p>"
          : "<strong>This page is taking a while to start.</strong><p>Your connection may be slow. Please wait a little, or press Ctrl+Shift+R to reload.</p>";
      (document.body || document.documentElement).appendChild(box);
    }
    var failed = function () { crashed = true; setTimeout(show, 1500); };
    window.addEventListener("error", function (e) { if (!ready() && (e.target && e.target.tagName === "SCRIPT" || e.message)) failed(); }, true);
    window.addEventListener("unhandledrejection", function () { if (!ready()) failed(); });
    setInterval(function () { if (box && ready()) { box.remove(); box = null; } }, 500);   // the page did start after all
    setTimeout(show, onFile ? 500 : 20000);
  })();
  </script>

<body class="app" data-page="account">
  <a class="skip-link" href="#main">Skip to main content</a>
  <main class="app-main" id="main" tabindex="-1">
    <div class="page">
      <header class="page-head"><div><h1>Account</h1><p>Your details help CropGuard give advice that fits you.</p></div></header>
      <div class="account-grid">
        <form class="panel panel-pad form" id="account-form" novalidate>
          <div class="row account-id"><span class="avatar avatar--lg" id="acc-avatar">?</span><div><p class="faint" style="margin:0;font-size:var(--fs-xs)">Username</p><p style="margin:0;font-weight:700" id="acc-username">…</p></div></div>
          <div class="alert alert--error" data-form-error role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><p data-form-error-text></p></div>
          <div class="form-grid">
            <div class="field"><label for="email">Email <span class="faint">(optional)</span></label><input class="input" id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error"><p class="field-error" id="email-error"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-alert"/></svg><span></span></p></div>
            <div class="field"><label for="phone">Phone <span class="faint">(optional)</span></label><input class="input" id="phone" name="phone" type="tel" autocomplete="tel" aria-describedby="phone-error"><p class="field-error" id="phone-error"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-alert"/></svg><span></span></p></div>
            <div class="field"><label for="district">District</label><input class="input" id="district" name="district" list="districts" autocomplete="off" aria-describedby="district-error"><datalist id="districts"></datalist><p class="field-error" id="district-error"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-alert"/></svg><span></span></p></div>
          </div>
          <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="padding:0;margin-bottom:.4rem">Language</legend><div class="segmented" id="lang-seg" role="radiogroup" aria-label="Language"></div><p class="hint">Used for the app and for AI advice.</p></fieldset>
          <div class="row"><button class="btn" type="submit" id="save-btn">Save changes</button><span class="saved-note" id="saved-note" role="status"></span></div>
        </form>
        <aside class="panel panel-pad stack">
          <h2 style="font-size:var(--fs-lg)">Session</h2>
          <p class="muted" style="margin:0">Signing out keeps your checks safe in your account.</p>
          <button class="btn btn--secondary" type="button" id="logout-btn"><svg class="icon" aria-hidden="true"><use href="#i-logout"/></svg>Sign out</button>
        </aside>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/account.js"></script>
</body>
