  <script>try{var l=localStorage.getItem("cropguard.lang");if(l&&l!=="en"){document.documentElement.classList.add("i18n-pending");setTimeout(function(){document.documentElement.classList.remove("i18n-pending")},2500)}}catch(e){}</script>
  <style>.i18n-pending body{visibility:hidden}</style>
  <script>
  /* Start-up watchdog. A slow connection is NOT an error, so: it waits 20 s, it removes itself the moment the page
     does start, and it speaks up at once only if a script really failed to load or crashed. */
  (function () {
    var onFile = location.protocol === "file:", box = null, crashed = false;
    var ready = function () { return document.documentElement.getAttribute("data-ready"); };
    function show() {
      if (ready() || box) return;
      box = document.createElement("div"); box.className = "boot-warning"; box.setAttribute("role", "alert");
      box.innerHTML = onFile
        ? "<strong>Open CropGuard through a small web server, not by double-clicking the file.</strong><p>Browsers block the page scripts on file:// addresses. Double-click <code>run-frontend.bat</code> (Windows) or run <code>./run-frontend.sh</code> in the project folder, or in the <code>frontend</code> folder run <code>python -m http.server 5500</code> and open <code>http://127.0.0.1:5500</code>.</p>"
        : crashed
          ? "<strong>This page hit a problem while starting.</strong><p>Press Ctrl+Shift+R to reload. If it still looks wrong, open the browser console (F12) and look for a red error message.</p>"
          : "<strong>This page is taking a while to start.</strong><p>Your connection may be slow. Please wait a little, or press Ctrl+Shift+R to reload.</p>";
      (document.body || document.documentElement).appendChild(box);
    }
    var failed = function () { crashed = true; setTimeout(show, 1500); };
    window.addEventListener("error", function (e) { if (!ready() && (e.target && e.target.tagName === "SCRIPT" || e.message)) failed(); }, true);
    window.addEventListener("unhandledrejection", function () { if (!ready()) failed(); });
    setInterval(function () { if (box && ready()) { box.remove(); box = null; } }, 500);   // the page did start after all
    setTimeout(show, onFile ? 500 : 20000);
  })();
  </script>

<body class="app" data-page="advisory">
  <a class="skip-link" href="#main">Skip to main content</a>
  <main class="app-main" id="main" tabindex="-1">
    <div class="page">
      <header class="page-head">
        <div><h1>Weather advice</h1><p>The next 24 hours for your area, with advice on irrigation and spraying.</p></div>
      </header>
      <form class="panel panel-pad adv-form" id="adv-form" novalidate>
        <div class="alert alert--error" data-form-error role="alert" hidden><svg class="icon" aria-hidden="true"><use href="#i-alert"/></svg><p data-form-error-text></p></div>
        <div class="field"><label for="city">District or town</label><input class="input" id="city" name="city" list="districts" autocomplete="off" placeholder="e.g. Musanze" aria-describedby="city-error" required><datalist id="districts"></datalist><p class="field-error" id="city-error"><svg class="icon icon--sm" aria-hidden="true"><use href="#i-alert"/></svg><span></span></p></div>
        <fieldset class="field" style="border:0;padding:0;margin:0"><legend class="label" style="padding:0;margin-bottom:.4rem">Language</legend><div class="segmented" id="lang-seg" role="radiogroup" aria-label="Language"></div></fieldset>
        <button class="btn btn--lg" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-sparkle"/></svg>Get advice</button>
      </form>

      <div id="adv-loading" class="stack" hidden aria-live="polite"><div class="skeleton" style="height:9rem"></div><div class="skeleton" style="height:12rem"></div></div>

      <div id="adv-result" class="stack-lg" hidden>
        <section class="advice-card" aria-labelledby="out-title">
          <div class="advice-card-head">
            <h2 id="out-title">Advice for <span id="out-city"></span></h2>
            <div class="segmented segmented--dark" id="adv-tabs" role="radiogroup" aria-label="Language"></div>
          </div>
          <div class="prose-ai" id="out-advice" aria-live="polite"></div>
        </section>
        <dl class="stat-strip" aria-label="Forecast summary">
          <div class="stat"><dt>Rain expected</dt><dd id="out-rain"></dd></div>
          <div class="stat"><dt>Average temperature</dt><dd id="out-temp"></dd></div>
          <div class="stat"><dt>Highest humidity</dt><dd id="out-hum"></dd></div>
        </dl>
        <section class="panel panel-pad" aria-labelledby="chart-title">
          <div class="section-title"><h2 id="chart-title">Next 24 hours</h2>
            <p class="legend" aria-hidden="true"><span><i style="background:var(--forest-900)"></i>Temperature</span><span><i style="background:var(--rain)"></i>Rain</span></p></div>
          <div id="chart"></div>
          <details class="disclosure"><summary><svg class="icon icon--sm" aria-hidden="true"><use href="#i-chevron"/></svg>Show the hour-by-hour table</summary>
            <div class="table-wrap"><table><thead><tr><th scope="col">Time</th><th scope="col">Temperature</th><th scope="col">Humidity</th><th scope="col">Sky</th><th scope="col">Wind</th><th scope="col">Rain</th></tr></thead><tbody id="out-rows"></tbody></table></div></details>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="js/pages/advisory.js"></script>
</body>
